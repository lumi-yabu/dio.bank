[project]
name = "desenvolvimento-de-apis-com-flask"
version = "0.1.0"
description = ""
authors = [
    {name = "Lumi Yabu",email = "gabrielayabu@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy",
    "flask-migrate",
    "flask-jwt-extended (>=4.7.4,<5.0.0)",
    "pytest",
    "pytest-mock",
    "psycopg2-binary",
    "gunicorn"
]

[tool.poetry]
package-mode = false

[tool.pytest]
addopts = ["-ra", "-vvv"]
testpaths = [
    "tests",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
